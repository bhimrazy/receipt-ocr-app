name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, format, dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check:deps
      - run: bun run knip
      - run: bun run audit

  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        # postgres:18.6-alpine, same digest as docker-compose.yml.
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receipt_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receipt_ocr"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rustfs:
        # rustfs/rustfs:1.0.0, same digest as docker-compose.yml.
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      BETTER_AUTH_URL: http://localhost:3004
      BETTER_AUTH_SECRET: ci-secret-not-for-production-000000000
      GOOGLE_GENERATIVE_AI_API_KEY: dummy-ci
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipt-ocr
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Create the S3 bucket
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
            --user rustfsadmin:rustfsadmin -X PUT http://localhost:9000/receipt-ocr)
          case "$code" in 200|409) ;; *) echo "bucket create failed: HTTP $code" >&2; exit 1 ;; esac
      - run: bun run db:migrate
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
