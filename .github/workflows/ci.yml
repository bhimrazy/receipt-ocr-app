name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its running CI. Runs on main are never cancelled: production.yml deploys
# the commit whose CI succeeded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a PR needs. Pushes to main always run everything. Skipped jobs count as passed,
  # and `ci-ok` is the single job to require.
  changes:
    name: Changed files
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      # Anything but docs and Markdown: typecheck, unit tests, build.
      code: ${{ steps.diff.outputs.code }}
      # Anything the running app, its tests or its build depend on: e2e jobs.
      app: ${{ steps.diff.outputs.app }}
      # Anything under .github/: the workflow audit.
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent (the base) are enough to list the PR's files.
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          code=true app=true workflows=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            if [ -n "$files" ]; then
              echo "$files"
              # `|| true`: grep -v exits 1 when every file is filtered out.
              rest=$(echo "$files" | grep -vE '^docs/|\.md$' || true)
              [ -n "$rest" ] || code=false
              rest=$(echo "$files" | grep -vE '^(docs|bench)/|\.md$|^\.github/(workflows/(db-migrate|load|preview|production)\.yml|vercel-cli/|dependabot\.yml|ISSUE_TEMPLATE/)' || true)
              [ -n "$rest" ] || app=false
              rest=$(echo "$files" | grep -E '^\.github/' || true)
              [ -n "$rest" ] || workflows=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
          echo "code=$code app=$app"

  static:
    name: Lint, format, dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check
      - run: bun run lint
      - run: bun run check:deps
      - run: bun run email:check
      - run: bun run knip
      - run: bun run audit
      # A schema change without its migration fails here. drizzle-kit generate diffs the schema
      # against the committed snapshots and never connects to a database.
      - name: Migrations match the schema
        timeout-minutes: 3
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain -- apps/web/drizzle)" ]; then
            git status --short -- apps/web/drizzle
            echo "::error::packages/db schema changed without a migration: run bun run db:generate and commit apps/web/drizzle."
            exit 1
          fi

  # Static audit of the workflows (injection, excessive permissions, unpinned actions). Medium and up fails.
  zizmor:
    name: Workflow audit (zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exact pin, like every dependency; 1.31.1 is the newest release past the 7-day cooldown.
      - run: pipx run --spec zizmor==1.31.1 zizmor --min-severity medium .github/

  checks:
    name: Typecheck, test, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/next-cache
        with:
          scope: checks
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Emails are prerendered by packages/email; React Email must never reach the server bundle.
      - name: No React Email in the server bundle
        run: |
          du -sh apps/web/.next/server
          # Code fingerprints only: the prerendered HTML itself carries data-id="__react-email-column".
          if grep -rlE --include='*.js' '@react-email_|react-email\.element|pixelBasedPreset|sanitizeNonInlinableRules' apps/web/.next/server; then
            echo "React Email reached the server bundle (see the files above)." >&2
            exit 1
          fi
      # CI builds with no SENTRY_DSN, so no Sentry code may ship to the browser.
      - name: No Sentry in the browser bundle without a DSN
        run: |
          if grep -rlE --include='*.js' 'sentry\.io|BrowserClient|__SENTRY' apps/web/.next/static; then
            echo "Sentry code reached the browser bundle without a DSN (see the files above)." >&2
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        # postgres:18.6-alpine, same digest as docker-compose.yml.
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receipt_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receipt_ocr"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rustfs:
        # rustfs/rustfs:1.0.4, same digest as docker-compose.yml.
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      BETTER_AUTH_URL: http://localhost:3004
      BETTER_AUTH_SECRET: ci-secret-not-for-production-000000000
      GOOGLE_GENERATIVE_AI_API_KEY: dummy-ci
      OCR_PROVIDER: fixture
      E2E_UPLOAD: "1"
      # No mailer in CI, so sign-up skips verification (on by default in production).
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      # Playwright sends a per-worker x-forwarded-for, so rate limits apply per test client.
      TRUSTED_IP_HEADERS: x-forwarded-for
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipt-ocr
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Create the S3 bucket
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
            --user rustfsadmin:rustfsadmin -X PUT http://localhost:9000/receipt-ocr)
          case "$code" in 200|409) ;; *) echo "bucket create failed: HTTP $code" >&2; exit 1 ;; esac
      - run: bun run db:migrate
      - uses: ./.github/actions/next-cache
        with:
          scope: e2e
      - uses: ./.github/actions/playwright
      # The build doesn't touch the database, so it overlaps the integration suites.
      - name: Integration tests (Postgres + RustFS) and build
        run: |
          bun run build > "$RUNNER_TEMP/build.log" 2>&1 &
          build=$!
          status=0
          bun run --filter @receipt-ocr/core test:int && bun run --filter @receipt-ocr/web test:int || status=$?
          wait "$build" || status=$?
          cat "$RUNNER_TEMP/build.log"
          exit "$status"
        env:
          INTEGRATION: "1"
      - run: bun run test:e2e
      # The GA id is inlined at build time, so the consent flow with GA needs its own build.
      - name: Build with a test GA measurement id
        run: bun run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-E2ETEST01
      - name: Consent e2e (GA build; Google is stubbed)
        working-directory: apps/web
        run: bunx playwright test e2e/consent-ga.spec.ts
        env:
          E2E_GA: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  e2e-turnstile:
    name: E2E (Turnstile test keys)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        # postgres:18.6-alpine, same digest as docker-compose.yml.
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receipt_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receipt_ocr"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rustfs:
        # rustfs/rustfs:1.0.4, same digest as docker-compose.yml.
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/receipt_ocr
      BETTER_AUTH_URL: http://localhost:3004
      BETTER_AUTH_SECRET: ci-secret-not-for-production-000000000
      GOOGLE_GENERATIVE_AI_API_KEY: dummy-ci
      OCR_PROVIDER: fixture
      E2E_UPLOAD: "1"
      # No mailer in CI, so sign-up skips verification (on by default in production).
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      # Playwright sends a per-worker x-forwarded-for, so rate limits apply per test client.
      TRUSTED_IP_HEADERS: x-forwarded-for
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipt-ocr
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: "true"
      CI: "true"
      # Cloudflare's test site key is inlined at build time; its test secrets report example.com.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_ALLOWED_HOSTNAMES: example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Create the S3 bucket
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
            --user rustfsadmin:rustfsadmin -X PUT http://localhost:9000/receipt-ocr)
          case "$code" in 200|409) ;; *) echo "bucket create failed: HTTP $code" >&2; exit 1 ;; esac
      - run: bun run db:migrate
      - uses: ./.github/actions/next-cache
        with:
          scope: turnstile
      - uses: ./.github/actions/playwright
      - run: bun run build
      - name: Turnstile e2e, always-pass secret
        working-directory: apps/web
        run: bunx playwright test e2e/turnstile.spec.ts
        env:
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          E2E_TURNSTILE: pass
      - name: Turnstile e2e, always-reject secret
        working-directory: apps/web
        run: bunx playwright test e2e/turnstile.spec.ts
        env:
          TURNSTILE_SECRET_KEY: 2x0000000000000000000000000000000AA
          E2E_TURNSTILE: fail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-turnstile
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # The one check to require: a skipped job (docs-only PR) passes, a failed or cancelled one fails.
  ci-ok:
    name: CI OK
    needs: [changes, static, zizmor, checks, e2e, e2e-turnstile]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
