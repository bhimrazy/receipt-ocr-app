name: Vercel Production Deployment

# Deploys main to production. Automatic after CI passes on a push to main, unless the release
# changes apps/web/drizzle since the last production deploy: migrations run only by hand (Database
# Migration workflow), so such a release waits for them and a manual run of this workflow. A manual
# run from main deploys once CI passed on its commit and production-db ran the same migrations. See docs/deployment.md, Every release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # Decides whether to deploy. Fails closed: if the last deploy can't be found, it doesn't.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history and tags, to diff against the last deployed commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Check for new migrations since the last deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            printf '### Production deploy skipped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$1"
          }
          # A manual run refuses (red) rather than skips: someone is waiting on it.
          refuse() {
            printf '### Production deploy refused\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            passed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$HEAD_SHA" -f event=push -f status=success --jq '.total_count') ||
              refuse "Can't check CI for ${HEAD_SHA:0:12}."
            [ "$passed" -gt 0 ] || refuse "CI hasn't passed on ${HEAD_SHA:0:12} (a push to main)."
            migrated=$(.github/scripts/last-migrated-sha.sh production-db) ||
              refuse "Can't find a successful production-db migration on main: run Database Migration for production-db first."
            changed=$(git diff --name-only "$migrated" "$HEAD_SHA" -- apps/web/drizzle/) ||
              refuse "Can't compare with the last production-db migration (${migrated:0:12})."
            if [ -n "$changed" ]; then
              refuse "main has migrations production hasn't run: run Database Migration for production-db first."
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: CI passed and production-db last migrated ${migrated:0:12} with the same migrations; deploying." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Moved by the record-deploy job after every successful deploy.
          if ! last=$(git rev-parse --verify --quiet "refs/tags/production-deployed^{commit}"); then
            skip "Can't find the last production deploy (tag production-deployed is missing). Run this workflow by hand from main once migrations are applied; that deploy sets the tag."
            exit 0
          fi
          changed=$(git diff --name-only "$last" "$HEAD_SHA" -- apps/web/drizzle/)
          if [ -n "$changed" ]; then
            skip "This release adds migrations: run Database Migration for staging-db, then production-db, then run this workflow by hand. Changed since ${last:0:12}: $(echo "$changed" | tr '\n' ' ')"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "No migration changes since ${last:0:12}; deploying." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: vercel
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Install Vercel CLI (pinned, own lockfile)
        run: |
          bun install --frozen-lockfile --cwd .github/vercel-cli
          echo "$GITHUB_WORKSPACE/.github/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      # No token for the build step: it runs repository code, which only needs the pulled settings.
      - name: Build project
        run: vercel build --prod

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --archive=tgz

  # Records what's live, for the next run's gate. Separate job: the only one with write access, and
  # it runs no repository code.
  record-deploy:
    needs: deploy-production
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Move the production-deployed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/production-deployed" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/production-deployed" -f sha="$SHA" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/production-deployed -f sha="$SHA" --silent
          fi
          echo "Tagged $SHA as production-deployed." >> "$GITHUB_STEP_SUMMARY"
