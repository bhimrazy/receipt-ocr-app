name: Vercel Production Deployment

# Runs only after CI (lint, format, dependencies, audit, typecheck, tests, build, e2e) passes on a
# push to main, or by hand from main: migrate staging, then production, then deploy. A failed
# migration stops the pipeline before the deploy; see docs/runbook.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  migrate-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: staging-db
      # The commit CI tested, not whatever main points at now.
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  # Staging goes first so a migration that fails there never reaches production.
  migrate-production:
    needs: migrate-staging
    permissions:
      contents: read
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: production-db
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  deploy-production:
    # Code ships only onto a schema that already has its migrations.
    needs: migrate-production
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: vercel
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Install Vercel CLI (pinned, own lockfile)
        run: |
          bun install --frozen-lockfile --cwd .github/vercel-cli
          echo "$GITHUB_WORKSPACE/.github/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      # No token for the build step: it runs repository code, which only needs the pulled settings.
      - name: Build project
        run: vercel build --prod

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --archive=tgz
