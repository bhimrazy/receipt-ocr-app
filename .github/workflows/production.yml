name: Vercel Production Deployment

# Deploys main to production. Automatic after CI passes on a push to main, unless the release
# changes apps/web/drizzle since the last production deploy: migrations run only by hand (Database
# Migration workflow), so such a release waits for them and a manual run of this workflow. A manual
# run from main deploys once CI passed on its commit and production-db ran the same migrations. See docs/deployment.md, Every release.
on:
  # Runs main's own file; the gate job only passes a successful CI push on main in this repo.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # Decides whether to deploy. Fails closed: if the last deploy can't be found, it doesn't.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history, to diff against the last deployed commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Check for new migrations since the last deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_HEALTH_URL: https://receipt-ocr.bhimraj.com.np/api/health
        run: |
          skip() {
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            printf '### Production deploy skipped\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$1"
          }
          # A manual run refuses (red) rather than skips: someone is waiting on it.
          refuse() {
            printf '### Production deploy refused\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            passed=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$HEAD_SHA" -f event=push -f status=success --jq '.total_count') ||
              refuse "Can't check CI for ${HEAD_SHA:0:12}."
            [ "$passed" -gt 0 ] || refuse "CI hasn't passed on ${HEAD_SHA:0:12} (a push to main)."
            migrated=$(.github/scripts/last-migrated-sha.sh production-db) ||
              refuse "Can't find a successful production-db migration on main: run Database Migration for production-db first."
            changed=$(git diff --name-only "$migrated" "$HEAD_SHA" -- apps/web/drizzle/) ||
              refuse "Can't compare with the last production-db migration (${migrated:0:12})."
            if [ -n "$changed" ]; then
              refuse "main has migrations production hasn't run: run Database Migration for production-db first."
            fi
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: CI passed and production-db last migrated ${migrated:0:12} with the same migrations; deploying." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Newest main run whose deploy-production job succeeded; fails closed.
          if ! last=$(.github/scripts/last-deployed-sha.sh); then
            skip "Can't tell which commit production runs (/api/health unreadable, or its commit isn't in this history). Run this workflow by hand from main once migrations are applied."
            exit 0
          fi
          if ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            skip "The last production deploy (${last:0:12}) isn't in this checkout's history; can't compare migrations."
            exit 0
          fi
          changed=$(git diff --name-only "$last" "$HEAD_SHA" -- apps/web/drizzle/)
          if [ -n "$changed" ]; then
            skip "This release adds migrations: run Database Migration for staging-db, then production-db, then run this workflow by hand. Changed since ${last:0:12}: $(echo "$changed" | tr '\n' ' ')"
            exit 0
          fi
          # Docs, tests and CI-only merges don't change the app; the next real change deploys them too.
          if ! shipped=$(.github/scripts/shipped-files.sh "$last" "$HEAD_SHA"); then
            skip "Can't compare with the last production deploy (${last:0:12})."
            exit 0
          fi
          if [ -z "$shipped" ]; then
            skip "Nothing that ships changed since ${last:0:12} (docs, tests or CI only)."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "No migration changes since ${last:0:12}; deploying." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Main-only (deployment branch policy), so its secrets, SENTRY_AUTH_TOKEN among them, never reach
    # PR runs; previews use `vercel-preview`. See docs/deployment.md, Deploy.
    environment: vercel-production
    permissions:
      contents: read
    env:
      VERCEL_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      SENTRY_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/sentry-cli
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Install Vercel and Sentry CLIs (pinned, own lockfile)
        run: |
          bun install --frozen-lockfile --cwd .github/vercel-cli

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL_BIN" pull --yes --environment=production

      # No token for the build step: it runs repository code, which only needs the pulled settings.
      # UPLOAD_SOURCE_MAPS makes Next emit browser and server maps (next.config.ts). GIT_COMMIT_SHA
      # is the release the browser bundle reports when the pulled VERCEL_GIT_COMMIT_SHA is empty;
      # the server reads VERCEL_GIT_COMMIT_SHA, which the deploy sets from the same checkout.
      - name: Build project
        env:
          UPLOAD_SOURCE_MAPS: "1"
          GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          "$VERCEL_BIN" build --prod

      # Runs no repository code: only the pinned Sentry CLI reads the build output while the token
      # is set. Debug IDs tie each file to its map; the release (the short commit the SDK reports)
      # only groups the upload. A missing setting or a failed upload warns and the deploy goes on
      # with unreadable stack traces, never with maps. The org token carries the Sentry URL.
      - name: Upload source maps to Sentry
        id: sentry
        continue-on-error: true
        timeout-minutes: 5
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set in the vercel-production environment; source maps not uploaded."
              exit 0
            fi
          done
          # Browser bundles are in .vercel/output/static/_next; the rest of static is public/, hard
          # linked to the checkout and left alone (sw.js must not change). Server files are deployed
          # from where Next wrote them (each function's .vc-config.json lists them in filePathMap).
          # A function that holds its own copies has a `.next` inside instead.
          server=()
          while IFS= read -r dir; do
            if [ -d "$dir" ]; then server+=("$dir"); fi
          done < <(
            find .vercel/output/functions -name .vc-config.json -not -path '*/node_modules/*' \
              -exec jq -r '.filePathMap[]?' {} + 2>/dev/null |
              sed -n 's#^\(\(.*/\)\{0,1\}\.next/server\)/.*\.js$#\1#p' | sort -u
          )
          if [ "${#server[@]}" -eq 0 ]; then
            while IFS= read -r dir; do server+=("$dir"); done < <(
              find .vercel/output/functions -type d -name .next -not -path '*/node_modules/*' -prune 2>/dev/null | sort
            )
          fi
          dirs=("${server[@]}")
          if [ -d .vercel/output/static/_next ]; then dirs+=(.vercel/output/static/_next); fi
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::warning::No static or server files found in .vercel/output; source maps not uploaded."
            exit 0
          fi
          if [ "${#server[@]}" -eq 0 ]; then
            echo "::warning::No server files found through .vercel/output/functions; uploading browser maps only."
          fi
          # Only bundles with a map on disk, and never a manifest: server-reference-manifest.js
          # holds the Server Actions encryption key. The map is named by the bundle's
          # sourceMappingURL (browser bundles are renamed after their map is written) or else
          # sits next to it as <name>.map.
          files=()
          while IFS= read -r -d '' js; do
            url=$(tail -c 4096 "$js" | sed -n 's|^//# sourceMappingURL=\([^ ]*\)$|\1|p' | tail -n 1)
            # Percent-encoded: server chunk names hold brackets like [externals].
            map="$(dirname "$js")/$(printf '%b' "${url//%/\\x}")"
            if [ -z "$url" ] || [ ! -f "$map" ]; then map="$js.map"; fi
            if [ -f "$map" ]; then files+=("$js" "$map"); fi
          done < <(find "${dirs[@]}" -name '*.js' -not -path '*/node_modules/*' -print0)
          for file in "${files[@]}"; do
            case "${file##*/}" in
              *-manifest.*)
                echo "::error::Refusing to upload $file: manifests can hold keys."
                exit 1
                ;;
            esac
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No source maps found in the build output; nothing uploaded."
            exit 0
          fi
          echo "Uploading $(( ${#files[@]} / 2 )) files with their maps."
          "$SENTRY_BIN" sourcemaps inject --ignore '*-manifest.*' "${files[@]}"
          "$SENTRY_BIN" sourcemaps upload --ignore '*-manifest.*' \
            --release "${COMMIT_SHA:0:7}" "${files[@]}"

      - name: Warn if the source-map upload failed
        if: steps.sentry.outcome == 'failure'
        run: |
          echo "::warning::Source-map upload to Sentry failed; deploying without it (stack traces stay minified for this release)."

      # Browser maps left in the output would be served as static files, and a server map would
      # ship if a function listed it. Fails the job if any is left.
      - name: Delete source maps
        run: |
          find .vercel/output apps/web/.next -name '*.map' -delete
          left=$(find .vercel/output apps/web/.next -name '*.map' -print -quit)
          if [ -n "$left" ]; then
            echo "::error::Source map left in the build output: $left"
            exit 1
          fi

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL_BIN" deploy --prebuilt --prod --archive=tgz
