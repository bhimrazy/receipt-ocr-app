name: Vercel Preview Deployment

# Previews use the staging database (Vercel's Preview env vars) and never run migrations: a PR whose
# migration hasn't merged yet won't find its tables there. See docs/deployment.md.
#
# The free Vercel plan allows 100 deployments a day (production deploys included) and 10 GB of
# function storage. Until launch, a PR gets a preview only when it carries the `preview` label
# (repository variable PREVIEW_MODE unset or `label`), and only when the label is added: later pushes
# don't redeploy. To refresh a preview, remove and re-add the label. Set PREVIEW_MODE=auto to also
# deploy every push to a ready-for-review PR that changes something the app ships.
#
# A push to the `preview` branch always deploys and aliases the fixed preview domains (docs/production-environment.md).
# Only the owner should push there.
on:
  push:
    branches: [preview]
  # Every PR, including stacked ones whose base isn't main.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

permissions: {}

concurrency:
  # A newer push cancels the deploy in flight. Label runs get their own group, so a push right after
  # labelling (which doesn't deploy in label mode) can't cancel the label's deploy, and a run for some
  # other label can't cancel anything.
  group: ${{ github.event_name == 'push' && format('vercel-preview-branch-{0}', github.ref_name) || format('vercel-preview-{0}{1}', github.event.pull_request.number, github.event.action == 'labeled' && (github.event.label.name != 'preview' && format('-ignored-{0}', github.run_id) || '-labeled') || '') }}
  cancel-in-progress: true

jobs:
  changes:
    name: Needs a preview?
    # Dependabot and fork PRs get no secrets, so a preview could only fail.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # The label deploys once, when added; pushes after that don't use up the daily deploys.
          FORCED: ${{ github.event.action == 'labeled' && github.event.label.name == 'preview' }}
          MODE: ${{ vars.PREVIEW_MODE || 'label' }}
        run: |
          deploy=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = push ] || [ "$FORCED" = true ]; then
            deploy=true
          elif [ "$MODE" = auto ] && [ "$DRAFT" != true ]; then
            shipped=$(.github/scripts/shipped-files.sh HEAD^1 HEAD)
            [ -n "$shipped" ] && deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"

  deploy-preview:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: vercel
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_BIN: ${{ github.workspace }}/.github/vercel-cli/node_modules/.bin/vercel
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Install Vercel CLI (pinned, own lockfile)
        run: |
          bun install --frozen-lockfile --cwd .github/vercel-cli

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL_BIN" pull --yes --environment=preview

      # No token for the build step: it runs repository code, which only needs the pulled settings.
      - name: Build project
        run: |
          "$VERCEL_BIN" build

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # One archive upload instead of one request per build file (free plan: 5000 uploads/day).
          url=$("$VERCEL_BIN" deploy --prebuilt --archive=tgz)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      # Branch domains follow git metadata that a CLI deploy may not carry, so point them explicitly.
      # `alias set` is idempotent.
      - name: Alias the fixed preview domains
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          for domain in preview.receipt-ocr.bhimraj.com.np preview-receipt-ocr.vercel.app; do
            # Unlike deploy, alias set doesn't read VERCEL_ORG_ID; without --scope it looks up a personal account.
            "$VERCEL_BIN" alias set "$DEPLOYMENT_URL" "$domain" --scope "$VERCEL_ORG_ID"
          done

      - name: Find existing preview comment
        if: github.event_name == 'pull_request'
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- vercel-preview-comment -->

      - name: Post or update preview comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- vercel-preview-comment -->
            ## Preview deployment

            | | |
            |---|---|
            | **URL** | ${{ steps.deploy.outputs.preview_url }} |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

            Uses the staging database. Migrations in this PR are not applied there until it merges.

            This comment updates with the newest deployment on each push.
