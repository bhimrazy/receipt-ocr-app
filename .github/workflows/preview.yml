name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: vercel-preview
    permissions:
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Alias deployment to PR number
        id: alias
        run: |
          alias="receipt-ocr-pr-${{ github.event.pull_request.number }}.vercel.app"
          vercel alias set ${{ steps.deploy.outputs.preview_url }} $alias --token=${{ secrets.VERCEL_TOKEN }}
          echo "alias_url=https://$alias" >> $GITHUB_OUTPUT

      - name: Find existing preview comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- vercel-preview-comment -->

      - name: Post or update preview comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- vercel-preview-comment -->
            ## 🔍 Preview Deployment

            | | |
            |---|---|
            | **Status** | ✅ Ready |
            | **Alias** | ${{ steps.alias.outputs.alias_url }} |
            | **Unique URL** | ${{ steps.deploy.outputs.preview_url }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.sha }}` |

            *Alias is stable for this PR — updates automatically on each push.*
