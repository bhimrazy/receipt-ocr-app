# Local development stack.
#
#   docker compose up -d          # Postgres + MinIO only (run the app with `pnpm dev`)
#   docker compose --profile app up --build   # …plus the app in a container
#
# Everything except the Gemini API key works offline. Set
# GOOGLE_GENERATIVE_AI_API_KEY in your shell or a root .env for real OCR;
# without it the app still runs, and uploads fail with a config error.

name: receipt-ocr

# No `restart:` policies on purpose: stopped containers stay stopped until you
# bring them back with `pnpm docker:up`.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receipt_ocr
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipt_ocr"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage. The app is R2-first but speaks plain S3, so MinIO
  # stands in locally with no code changes — only env.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket the app expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/receipt-ocr &&
      echo 'bucket receipt-ocr ready'
      "

  # Applies drizzle migrations, then exits. Runs automatically before `app`,
  # or on its own: `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/receipt_ocr
      DIRECT_URL: postgres://postgres:postgres@postgres:5432/receipt_ocr
    working_dir: /repo/apps/web
    command: pnpm exec drizzle-kit migrate

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/receipt_ocr
      DIRECT_URL: postgres://postgres:postgres@postgres:5432/receipt_ocr
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me-0000}
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: receipt-ocr
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-receiptOCR <onboarding@resend.dev>}

volumes:
  postgres-data:
  minio-data:
